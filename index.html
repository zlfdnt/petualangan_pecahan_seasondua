<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan Pecahan — SMP Maitreyawira Bintan Center</title>
<meta name="description" content="Belajar pecahan Kelas VII lewat petualangan tiga dunia.">
<meta name="theme-color" content="#5B2A9A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%235B2A9A'/%3E%3Cpath d='M64 108L26 40q38-20 76 0z' fill='%23FFC93C'/%3E%3Ccircle cx='50' cy='52' r='5' fill='%23F2705C'/%3E%3Ccircle cx='78' cy='52' r='5' fill='%23F2705C'/%3E%3Ccircle cx='64' cy='84' r='5' fill='%23F2705C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B1B4D;--mut:#5E5278;--pur:#5B2A9A;--grn:#3E8E2F;--grn2:#2A651F;--sun:#FFC93C;--cor:#F2705C;--sky:#4DB6E8;--mint:#BFEBCB;--bg:#F7F3FF;--cream:#FFF8EF;--sh:0 8px 24px rgba(91,42,154,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:600 16px/1.6 Nunito,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Baloo 2',sans-serif;line-height:1.15;margin:0 0 .4em;color:var(--pur)}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}h2{font-size:1.9rem}h3{font-size:1.25rem}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
section{padding:40px 0}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border:0;border-radius:9999px;background:var(--grn);color:#fff;font:700 1rem 'Baloo 2',sans-serif;box-shadow:0 4px 0 var(--grn2);cursor:pointer;text-decoration:none;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{to{left:140%}}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 0 var(--grn2),0 0 22px rgba(255,201,60,.8)}
.btn.sec{background:#fff;color:var(--pur);border:2px solid var(--pur);box-shadow:0 4px 0 #421D73}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c99a10}
.btn.cor{background:var(--cor);box-shadow:0 4px 0 #b84a39}
.btn[disabled]{background:#E1D7F7;color:var(--mut);box-shadow:none;cursor:not-allowed}.btn[disabled]::after{display:none}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.glow:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 0 0 3px var(--sun),0 14px 34px rgba(255,201,60,.55)}
/* slideshow */
.sl{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#ddd}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}.sl img.on{opacity:1}
.sl .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}.sl .dots i{width:8px;height:8px;border-radius:50%;background:#fff8;transition:.3s}.sl .dots i.on{background:#fff;width:20px;border-radius:8px}
/* hero */
.hero{display:grid;gap:24px;align-items:center;padding:28px 0}
@media(min-width:800px){.hero{grid-template-columns:1fr 1fr}}
.hero .sl{aspect-ratio:4/3;box-shadow:var(--sh)}
.hero p{font-size:1.15rem;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.w1{border-top:8px solid #7CCB93;background:#D6F2DA}.w2{border-top:8px solid #FFD36B;background:#FFEFB5}.w3{border-top:8px solid #8FD3F4;background:#D5F0FB}
/* testimoni flip */
.fl{perspective:900px;min-height:190px;cursor:pointer}
.fl>div{position:relative;height:100%;min-height:190px;transition:transform .7s;transform-style:preserve-3d}
.fl.flip>div{transform:rotateY(180deg)}
.fl .f,.fl .b{position:absolute;inset:0;border-radius:20px;padding:20px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);background:#fff}
.fl .b{transform:rotateY(180deg);background:var(--cream)}
.fl:hover .f,.fl:hover .b{box-shadow:0 0 0 3px var(--sky),0 0 28px rgba(77,182,232,.7)}
.fl .em{font-size:2.4rem}
.tag{display:inline-block;background:#FFF3C4;border-radius:9999px;padding:2px 12px;font-size:.8rem}
/* form */
input,textarea{width:100%;min-height:52px;border:2px solid #D5F0FB;border-radius:16px;padding:10px 14px;font:inherit;background:#fff}
input:focus,textarea:focus{border-color:var(--grn);box-shadow:0 0 0 4px rgba(62,142,47,.15);outline:0}
textarea{min-height:96px;resize:vertical}label{display:block;margin:10px 0 4px}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:#fff;box-shadow:var(--sh);position:sticky;top:0;z-index:5}
.chip{background:#fff;border-radius:9999px;padding:4px 14px;box-shadow:var(--sh)}
.node{display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;background:#fff;box-shadow:var(--sh);margin:12px 0}
.node.k{opacity:.6}.node.t{border:2px solid var(--sun);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,201,60,.35)}}
.st{margin-left:auto;font-size:.85rem;border-radius:9999px;padding:2px 12px;background:#EFEAF8}
.opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;margin:8px 0;border:1.5px solid #D9CFEF;border-radius:16px;background:#fff;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.opt b{flex:none;width:32px;height:32px;border:2px solid var(--pur);border-radius:50%;display:grid;place-items:center;color:var(--pur)}
.opt.sel{background:#D7F1FC;border:2px solid var(--sky)}.opt.ok{background:#E3F7E8;border:2px solid var(--grn)}.opt.no{background:#FFE1DB;border:2px solid var(--cor)}
.exam{background:var(--bg)}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid5 button{min-height:44px;border:0;border-radius:12px;background:#EFEAF8;font-weight:700;color:var(--pur);cursor:pointer}
.grid5 .done{background:var(--sky);color:#fff}.grid5 .cur{outline:3px solid var(--pur)}
.timer{background:#fff;border-radius:9999px;padding:4px 16px;color:#1a7aa8;font-weight:800}.timer.low{color:var(--cor);animation:pulse 1s infinite}
#modal{position:fixed;inset:0;background:rgba(43,27,77,.88);display:grid;place-items:center;padding:16px;z-index:50}
#modal[hidden]{display:none}#modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
#modal .band{background:var(--cor);color:#fff;margin:-20px -20px 16px;padding:12px 20px;border-radius:20px 20px 0 0;font:800 1.1rem 'Baloo 2'}
#notif{position:fixed;bottom:84px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:9999px;opacity:0;transition:.3s;z-index:60;pointer-events:none}#notif.show{opacity:1;transform:translate(-50%,0)}
.sc{width:160px;height:160px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font:800 3.4rem 'Baloo 2';color:var(--grn);background:conic-gradient(var(--grn) var(--p),#E1D7F7 0)}.sc span{background:#fff;width:124px;height:124px;border-radius:50%;display:grid;place-items:center}
.emo{display:flex;gap:8px;flex-wrap:wrap}.emo button{font-size:1.8rem;width:64px;height:64px;border-radius:50%;border:2px solid #D9CFEF;background:#fff;cursor:pointer}.emo .sel{border-color:var(--pur);box-shadow:0 0 0 3px #EDE7FA}
/* kursor + dengan partikel */
html.cur,html.cur *{cursor:none!important}
#pc{position:fixed;inset:0;pointer-events:none;z-index:9998}
#plus{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:9999;transition:transform .15s}
#plus::before,#plus::after{content:"";position:absolute;background:var(--pur);border-radius:2px;box-shadow:0 0 0 1.5px #fff}
#plus::before{left:0;right:0;top:9px;height:4px}#plus::after{top:0;bottom:0;left:9px;width:4px}
#plus.h{transform:scale(1.7) rotate(90deg)}
body.exam #pc{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sl img{transition:none}}

/* Tambahan: peta dunia, nav, ujian, hasil, panel guru, cetak, PID */
.pz{max-width:100%;height:auto}
.navp{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:30;display:flex;gap:4px;background:#fff;border-radius:28px;padding:6px 8px;box-shadow:0 -4px 24px rgba(91,42,154,.16);max-width:96vw}
.navp button{border:0;background:none;border-radius:20px;padding:6px 12px;min-width:56px;min-height:48px;font:700 .75rem Nunito,sans-serif;color:#5E5278;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.navp button.on{background:#EDE7FA;color:#5B2A9A}.navp b{font-size:1.3rem;line-height:1}
body.has-nav main,body.has-nav .wrap{padding-bottom:96px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:2px solid #D9CFEF;background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;font:700 .9rem Nunito,sans-serif;cursor:pointer}
.tabs button.on{border-color:#5B2A9A;background:#EDE7FA;color:#3A1A6B}
.world{border-radius:20px;padding:16px;margin:14px 0;border:1.5px solid rgba(0,0,0,.06)}
.world.w1{background:#D6F2DA}.world.w2{background:#FFEFB5}.world.w3{background:#D5F0FB}
.world h3{margin:0 0 4px}.node{position:relative}
.node.done{background:#E3F7E8}.badge{display:inline-block;border-radius:999px;padding:2px 10px;font:700 .75rem Nunito,sans-serif;background:#fff}
.banner{background:#FFF3C4;border:2px solid #FFC93C;border-radius:20px;padding:14px;margin:12px 0}
.split{display:grid;gap:14px}@media(min-width:900px){.split.has{grid-template-columns:1fr 1fr}}
.stim{background:#F1EBFF;border-radius:16px;padding:14px;overflow:auto;max-height:70vh}
.stim table,.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.stim td,.stim th,.tbl td,.tbl th{border-bottom:1px solid #E1D7F7;padding:8px;text-align:left;vertical-align:top}
.tbl th{background:#F1EBFF;font:700 .75rem Nunito,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.tbl tr:nth-child(even) td{background:#FBF8FF}
.kat{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}
.kat .bs{display:flex;gap:6px}.kat .bs button{min-width:84px;min-height:48px;border-radius:14px;border:2px solid #D9CFEF;background:#fff;font:700 1rem Nunito,sans-serif;cursor:pointer}
.kat .bs button.sel{background:#D7F1FC;border-color:#4DB6E8}.kat .bs button.ok{background:#E3F7E8;border-color:#3E8E2F}.kat .bs button.no{background:#FFE1DB;border-color:#F2705C}
.isi{font:700 1.2rem Nunito,sans-serif;width:100%;max-width:340px}
.grid5 button.rg{background:#FFC93C;color:#2B1B4D}.grid5 button.cur{outline:3px solid #5B2A9A}
.pel{display:inline-flex;gap:4px;align-items:center;font:700 .85rem Nunito,sans-serif}.pel i{width:12px;height:12px;border-radius:50%;background:#D9CFEF}.pel i.on{background:#F2705C}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(#3E8E2F var(--p),#EDE7FA 0)}
.ring span{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 3rem 'Baloo 2',sans-serif}
.bar{height:14px;border-radius:99px;background:#EDE7FA;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.sv{background:#3E8E2F}.sk{background:#FFC93C}.sr{background:#F2705C}
.mis{background:#FFE1DB;border-radius:12px;padding:10px;margin-top:8px}
.crt{border:6px double #C9A227;background:#FFFDF5;padding:24px;text-align:center;border-radius:12px}
.crt h2{font-size:1.6rem}.crt .nm{font:800 2rem 'Baloo 2',sans-serif;color:#3E8E2F}
/* panel guru */
.gur{display:grid;min-height:100vh}.gside{background:#3B1F6E;color:#fff;padding:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gside b{font:800 1.1rem 'Baloo 2',sans-serif;width:100%}.gside button{background:none;border:0;color:#fff;border-radius:12px;padding:10px 12px;min-height:44px;font:700 .9rem Nunito,sans-serif;cursor:pointer;text-align:left}
.gside button.on{background:rgba(255,255,255,.18);box-shadow:inset 4px 0 #FFC93C}
.gmain{padding:16px;background:#F7F3FF;min-width:0}
@media(min-width:900px){.gur{grid-template-columns:240px 1fr}.gside{flex-direction:column;align-items:stretch;position:sticky;top:0;height:100vh;flex-wrap:nowrap}}
.stat{border-radius:16px;padding:14px;background:#fff;box-shadow:0 8px 24px rgba(91,42,154,.12)}.stat b{display:block;font:800 2rem 'Baloo 2',sans-serif}
.stat.m{background:#E3F7E8}.stat.s{background:#FFF3C4}.stat.k{background:#D7F1FC}.stat.c{background:#FFE1DB}
.chp{display:inline-block;border-radius:999px;padding:2px 10px;font:700 .75rem Nunito,sans-serif}.chp.a{background:#E3F7E8;color:#1B4D12}.chp.d{background:#FFE1DB;color:#7A1218}.chp.r{background:#FFF3C4;color:#6B3E00}.chp.b{background:#D7F1FC;color:#0b4a6b}.chp.g{background:#EDE7FA;color:#3A1A6B}
.scroll{overflow-x:auto}.pre{background:#F7F3FF;border-radius:12px;padding:10px;white-space:pre-wrap;font:.85rem ui-monospace,monospace}
select{font:inherit;min-height:48px;border:2px solid #D9CFEF;border-radius:16px;padding:0 12px;background:#fff}
body.exam .stim,body.exam .card.exam{user-select:none;-webkit-user-select:none}
@media(min-width:1700px){.btn,.opt,.navp button,.tabs button{min-height:64px}body{font-size:20px}.wrap{max-width:1500px;padding-inline:56px}}
@media print{body>*:not(#cetak){display:none!important}#cetak{display:block!important}}
#cetak{display:none}
.opt.ok{background:#E3F7E8;border-color:#3E8E2F}.opt.no{background:#FFE1DB;border-color:#F2705C}
.timer.warn{background:#FFE1DB;color:#B91C1C;animation:pulse 1s infinite}
@media(prefers-reduced-motion:reduce){.timer.warn{animation:none}}
#modal .band{font-family:Nunito,sans-serif}
/* pecahan bertumpuk */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .15em;font-family:'Cambria Math','Latin Modern Math','STIX Two Math',Cambria,'Noto Serif',serif;font-size:1.12em;font-weight:600}
.fr .n{border-bottom:.09em solid currentColor;padding:0 .22em .04em}.fr .d{padding:.04em .22em 0}
.wh{font-family:'Cambria Math','Latin Modern Math',Cambria,'Noto Serif',serif;font-size:1.12em;font-weight:600;vertical-align:middle;margin-left:.1em}
/* suara */
#snd{position:fixed;left:12px;bottom:12px;z-index:25;display:flex;gap:6px}
#snd button{width:44px;height:44px;border-radius:50%;border:2px solid #D9CFEF;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px rgba(91,42,154,.15)}
body.has-nav #snd{bottom:92px}body.exam #snd,body.guru #snd{display:none}
/* beranda identitas */
.idt{width:100%;border-collapse:collapse}.idt th{width:34%;text-align:left;color:#5E5278;font-weight:700;padding:8px;vertical-align:top}.idt td{padding:8px;border-bottom:1px solid #EDE7FA}
.tp{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:10px 0}.tp b{background:#EDE7FA;color:#3A1A6B;border-radius:12px;padding:4px 10px}
.pm{background:#F1EBFF;border-radius:16px;padding:14px;margin:10px 0}
.step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;margin:12px 0}.step i{width:44px;height:44px;border-radius:50%;background:#3E8E2F;color:#fff;display:grid;place-items:center;font:800 1.2rem Nunito,sans-serif;font-style:normal}
.opt .fr,.kat .fr{font-size:1.5em}h3 .fr,.stim .fr{font-size:1.3em}
/* ===== materi ===== */
.mat{max-width:900px}
.mi{width:48px;height:48px;border-radius:16px;background:var(--c,#7c4dcc);display:grid;place-items:center;font-size:1.6rem;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}.mi.big{width:72px;height:72px;font-size:2.4rem}
.node{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mhead{display:flex;gap:16px;align-items:center;border-left:10px solid var(--c)}
.msec{border-left:8px solid var(--c,#7c4dcc);border-radius:20px;background:#fff;margin:14px 0;box-shadow:0 8px 24px rgba(91,42,154,.1);overflow:hidden}
.msec .hd{display:flex;gap:10px;align-items:center;padding:12px 16px;cursor:pointer;min-height:48px}.msec .hd i{margin-left:auto;font-style:normal;transition:transform .2s}
.msec .ib{width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:1.2rem;flex:none}
.msec .sb{padding:0 18px 18px;line-height:1.7}.msec.cl .sb{display:none}.msec.cl .hd i{transform:rotate(-90deg)}
.msec p{margin:.6em 0}
mark.pb2{background:#FFE1CC;color:#8a3b00;border-radius:6px;padding:0 6px;font-weight:800}mark.pn3{background:#D5F5F0;color:#0b5c54;border-radius:6px;padding:0 6px;font-weight:800}
.vid{padding:16px}.vscr{background:linear-gradient(#fff,#f7f3ff);border:3px solid #E1D7F7;border-radius:20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;margin:10px 0;text-align:center}
.vcap{background:#FFF8EF;border-left:6px solid #ff8a3d;border-radius:14px;padding:12px 14px;min-height:3.4em;line-height:1.7;font-size:1.05rem}
.vctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.vpg{display:flex;gap:5px;margin-left:auto}.vpg i{width:12px;height:12px;border-radius:50%;background:#E1D7F7}.vpg i.d{background:#3E8E2F}.vpg i.c{background:#ff8a3d;transform:scale(1.3)}
.vid details{margin-top:10px}.vid details li{margin:6px 0}
.vb{width:min(100%,460px)}.va{width:min(100%,300px)}.vp{max-width:46vw}
.br{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}.bl{flex:0 0 96px;text-align:right;font-weight:700;font-size:.95rem}.stk{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.pp{animation:pp .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}@keyframes pp{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.mx{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:1.3rem;font-weight:700;margin:8px 0}.mx .ar{font-size:.8rem;line-height:1.1;background:#EDE7FA;color:#5B2A9A;border-radius:10px;padding:3px 8px;text-align:center}.mx .big,.big{font-size:1.5rem;color:#3A1A6B}
.cmp{font-size:1.5rem;font-weight:800;text-align:center;margin:8px 0;padding:8px 14px;background:#EDE7FA;border-radius:16px}
.pzr{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lns{text-align:left;background:#fff;border:2px dashed #7c4dcc;border-radius:16px;padding:10px 16px;font-size:1.15rem}.ln{margin:4px 0;animation:pp .4s both}.ln:nth-child(2){animation-delay:.3s}.ln:nth-child(3){animation-delay:.6s}.ln:nth-child(4){animation-delay:.9s}.ln:nth-child(5){animation-delay:1.2s}
.ring2{background:#FFF3C4;border:3px solid #FFC93C;border-radius:20px;padding:16px 22px;font-size:1.15rem;line-height:1.8;animation:pp .5s both}
.lit{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}.lit>div{background:#EDE7FA;border-radius:16px;padding:12px;animation:pp .5s both}.lit>div:nth-child(2){animation-delay:.25s}.lit>div:nth-child(3){animation-delay:.5s}.lit>div:nth-child(4){animation-delay:.75s}

<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="notif" role="status"></div>
<noscript><p style="font:18px sans-serif;padding:24px">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman.</p></noscript>
<script>
/* ============ SATU-SATUNYA YANG PERLU DIISI ============
   Tempel URL Web App Google Apps Script (berakhiran /exec) di antara tanda kutip. */
window.APP_CONFIG = { GAS_URL: 'https://script.google.com/macros/s/AKfycbzFlwOAtv3f4kRqxxRsZR1eQnULd80x1Khsc-hpI_v2DSXMsJ-Xpnz1Hrb9O4I8bJUxjg/exec' };
/* ======================================================= */
</script>
<script>
window.__err = []; addEventListener('error', function (e) { window.__err.push(e.message); });
setTimeout(function () { var a = document.getElementById('app'); if (a && !a.children.length) a.innerHTML = '<div style="font:16px/1.6 sans-serif;max-width:560px;margin:40px auto;padding:20px;background:#FFF3C4;border-radius:16px"><b>Aplikasi belum bisa ditampilkan.</b><br>Muat ulang halaman dengan Ctrl+Shift+R. Jika masih sama, kirimkan pesan ini ke pengembang:<pre style="white-space:pre-wrap">' + (window.__err.join('\n') || 'tidak ada pesan error') + '</pre></div>'; }, 2500);
</script>
<script>
// Petualangan Pecahan — frontend (vanilla JS). Semua data lewat fetch ke GAS.
const CFG = window.APP_CONFIG, M = document.getElementById('app');
const S = { tok: localStorage.pp_tok || '', nama: localStorage.pp_nama || '' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ok = () => !/GANTI|XXXX/.test(CFG.GAS_URL);
const toast = m => { const n = document.getElementById('notif'); n.textContent = m; n.className = 'show'; setTimeout(() => n.className = '', 3000); };

async function api(a, d) {
  if (!ok()) return { success: false, message: 'Konfigurasi belum lengkap: isi GAS_URL di bagian atas index.html (Ctrl+F lalu cari GAS_URL).' };
  try {
    const r = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: a, token: S.tok, data: d || {} }) });
    const j = await r.json(); if (j.code === 'AUTH') { keluar(); toast(j.message); } return j;
  } catch (e) { return { success: false, message: 'Koneksi bermasalah. Coba lagi.', net: true }; }
}
const keluar = () => { S.tok = S.nama = ''; localStorage.removeItem('pp_tok'); localStorage.removeItem('pp_nama'); landing(); };

// ---- gambar orisinal (SVG) untuk slideshow ----
function art(e, a, b) {
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><circle cx="520" cy="80" r="46" fill="#fff" opacity=".55"/><path d="M0 300Q160 250 320 300T640 290V360H0Z" fill="#fff" opacity=".35"/><text x="320" y="225" font-size="140" text-anchor="middle">${e}</text></svg>`);
}
const slider = (arr, alt) => `<div class="sl" role="img" aria-label="${esc(alt)}">${arr.map((x, i) => `<img src="${x}" alt="" class="${i ? '' : 'on'}" loading="lazy">`).join('')}<div class="dots">${arr.map((x, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></div>`;
setInterval(() => document.querySelectorAll('.sl').forEach(s => {
  const im = s.querySelectorAll('img'), dt = s.querySelectorAll('.dots i'); let i = [...im].findIndex(x => x.classList.contains('on'));
  im[i].classList.remove('on'); dt[i].classList.remove('on'); i = (i + 1) % im.length; im[i].classList.add('on'); dt[i].classList.add('on');
}), 3500);

const DUNIA = [
  { c: 'w1', n: 'Dunia 1: Pantai Hijau', t: 'Kedai pizza kelapa: pecahan senilai dan gambar dasar.', i: [art('🍕', '#D6F2DA', '#7CCB93'), art('🏖️', '#BFEBCB', '#3E9B5F'), art('🥥', '#E3F7E8', '#7CCB93')] },
  { c: 'w2', n: 'Dunia 2: Pulau Senja', t: 'Peti harta karun: tambah dan kurang pecahan.', i: [art('🗝️', '#FFEFB5', '#F29A1F'), art('🌅', '#FFD2A8', '#FFD36B'), art('🧰', '#FFF3C4', '#F29A1F')] },
  { c: 'w3', n: 'Dunia 3: Samudra Biru', t: 'Pompong dan mercusuar: soal literasi-numerasi ala TKA.', i: [art('⛵', '#D5F0FB', '#2E9BD6'), art('🗼', '#8FD3F4', '#D7F1FC'), art('🧭', '#D5F0FB', '#4DB6E8')] }
];
const TESTI = [
  { e: '🍕', j: 'Seru seperti main game', s: 'Pecahan terasa nyata karena pakai pizza dan resep.', f: 'Pecahan jadi mudah dibayangkan karena belajarnya lewat pizza, resep, dan diskon toko. Saya tidak takut salah lagi, karena ada penjelasan setelah menjawab dan boleh mengulang.', o: 'Contoh testimoni siswa' },
  { e: '👩‍🏫', j: 'Guru terbantu', s: 'Hasil dan refleksi siswa tercatat rapi.', f: 'Nilai pertama tersimpan resmi, latihan ulang tercatat terpisah, dan refleksi siswa menunjukkan bagian yang masih sulit. Tindak lanjut jadi lebih tepat sasaran.', o: 'Contoh testimoni guru' },
  { e: '👨‍👩‍👧', j: 'Orang tua tenang', s: 'Bisa belajar mandiri dari rumah.', f: 'Anak bisa berlatih di rumah dengan jalur yang jelas dan progres yang kelihatan. Nilai resmi tetap adil karena dihitung di server sekolah.', o: 'Contoh testimoni orang tua' }
];

// ---- landing ----
function landing() {
  document.body.classList.remove('exam');
  M.innerHTML = `<header class="top"><b style="font:800 1.2rem 'Baloo 2'">🍕 Petualangan Pecahan</b><span>${S.tok ? `<button class="btn" id="goMap" style="min-height:44px">Lanjutkan</button>` : `<button class="btn sec" id="goLogin" style="min-height:44px">Masuk</button>`}</span></header>
  <main class="wrap">
  <section class="hero"><div><h1>Petualangan Pecahan: jelajahi tiga dunia, kuasai pecahan.</h1>
  <p>Untuk siswa Kelas VII SMP Maitreyawira Bintan Center. Mulai dari pantai, seberangi pulau senja, lalu berlayar ke samudra biru.</p>
  <div class="row"><button class="btn" id="mulai">🚀 Mulai petualangan</button><a class="btn sec" href="#info">Lihat tiga dunia</a></div></div>
  ${slider([art('🍕', '#FFD2A8', '#E4DAFB'), art('⛵', '#D5F0FB', '#EDE7FA'), art('⭐', '#FFF3C4', '#FFD2A8')], 'Ilustrasi petualangan pecahan')}</section>
  <section id="info"><h2>Tiga dunia, tiga tantangan</h2><div class="grid">${DUNIA.map(d => `<article class="card glow ${d.c}">${slider(d.i, d.n)}<h3 style="margin-top:12px">${d.n}</h3><p>${d.t}</p><button class="btn" data-m>Mulai di sini</button></article>`).join('')}</div></section>
  <section><h2>Kata mereka</h2><p>Ketuk kartu untuk membaca selengkapnya.</p><div class="grid" id="tm">${TESTI.map((t, i) => `<div class="fl" data-i="${i}" tabindex="0" role="button" aria-label="Buka testimoni ${esc(t.j)}"><div><div class="f"><span class="em">${t.e}</span><h3>${t.j}</h3></div><div class="b"><p>“${t.s}”</p><span class="tag">${t.o}</span></div></div></div>`).join('')}</div></section>
  </main>
  <footer class="wrap" style="padding:24px 16px;color:var(--mut)">© SMP Maitreyawira Bintan Center • Kurikulum Merdeka Fase D</footer>`;
  document.getElementById('mulai').onclick = () => S.tok ? beranda() : loginView();
  M.querySelectorAll('[data-m]').forEach(b => b.onclick = () => S.tok ? beranda() : loginView());
  const gl = document.getElementById('goLogin'), gm = document.getElementById('goMap'); if (gl) gl.onclick = loginView; if (gm) gm.onclick = beranda;
  M.querySelectorAll('.fl').forEach(c => { const o = () => modal(`<h3>${TESTI[c.dataset.i].e} ${TESTI[c.dataset.i].j}</h3><p>${TESTI[c.dataset.i].f}</p><span class="tag">${TESTI[c.dataset.i].o}</span><p><button class="btn" id="x">Tutup</button></p>`); c.onclick = o; c.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), o()); });
}
let flipI = 0; setInterval(() => { const c = document.querySelectorAll('#tm .fl'); if (!c.length || document.hidden) return; c.forEach(x => x.classList.remove('flip')); c[flipI++ % c.length].classList.add('flip'); }, 4000);
function modal(h) { const m = document.getElementById('modal'); m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${h}</div>`; m.hidden = false; const x = m.querySelector('#x'); if (x) x.onclick = () => m.hidden = true; m.onclick = e => { if (e.target === m && !m.dataset.lock) m.hidden = true; }; }

// ---- login & peta ----
function loginView() {
  M.innerHTML = `<main class="wrap" style="max-width:460px;padding-top:40px"><div class="card"><h2>🍕 Hai, penjelajah!</h2><p>Tulis namamu untuk masuk (huruf besar atau kecil tidak masalah).</p><form id="f"><label for="n">Nama lengkap</label><input id="n" required autocomplete="name"><p id="er" style="color:#B84A39;min-height:1.5em"></p><button class="btn" type="submit">Masuk</button> <button class="btn sec" type="button" id="b">Kembali</button></form></div></main>`;
  document.getElementById('b').onclick = landing;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const r = await api('auth.login', { nama: n.value }); b.disabled = false;
    if (!r.success) return er.textContent = r.message;
    S.tok = r.data.token; S.nama = r.data.nama; localStorage.pp_tok = S.tok; localStorage.pp_nama = S.nama; mainkan('masuk'); beranda();
  };
}
const TAHAP = { A1: ['🍕', 'Asesmen 1: Pesta Pizza', 'Dunia 1 • Mudah, bernarasi'], R1: ['📝', 'Refleksi 1', 'Dunia 1'], A2: ['🗝️', 'Asesmen 2: Peti Harta', 'Dunia 2 • Menengah'], R2: ['📝', 'Refleksi 2', 'Dunia 2'], A3: ['⛵', 'Asesmen 3: Mode Ujian TKA', 'Dunia 3 • Individu, 3 peringatan'], R3: ['🏅', 'Refleksi 3 & Lencana', 'Dunia 3'] };
async function peta() {
  document.body.classList.remove('exam'); M.innerHTML = `<p class="wrap" style="padding:40px">Memuat petamu…</p>`;
  const r = await api('progres.get'); if (!r.success) return r.net ? (M.innerHTML = `<p class="wrap" style="padding:40px">${r.message} <button class="btn" onclick="peta()">Coba lagi</button></p>`) : (S.tok ? toast(r.message) : loginView());
  const st = r.data.status, tuntas = st.filter(x => x.status === 'selesai').length;
  M.innerHTML = `<header class="top"><b>Hai, ${esc(S.nama)}! 👋</b><span class="chip">⭐ ${tuntas * 15}</span><span><button class="btn sec" id="k" style="min-height:40px">Keluar</button></span></header>
  <main class="wrap"><section><h2>Peta Petualangan</h2><p>Progres: ${tuntas} dari 6 tahap selesai</p><progress max="6" value="${tuntas}" style="width:100%;height:14px"></progress>
  ${st.map(x => { const t = TAHAP[x.kode]; return `<div class="node ${x.status === 'terbuka' ? 't' : x.status === 'terkunci' ? 'k' : ''}"><span style="font-size:2rem">${t[0]}</span><div><h3 style="margin:0">${t[1]}</h3><small>${t[2]}</small></div><span class="st">${x.status === 'selesai' ? '✓ Selesai' : x.status === 'terbuka' ? '▶ MULAI' : '🔒 Terkunci'}</span>${x.status === 'terbuka' ? `<button class="btn" data-k="${x.kode}">Buka</button>` : ''}</div>`; }).join('')}</section></main>`;
  document.getElementById('k').onclick = keluar;
  M.querySelectorAll('[data-k]').forEach(b => b.onclick = () => b.dataset.k[0] === 'A' ? petunjuk(b.dataset.k[1]) : refleksi(b.dataset.k[1]));
}

  konsep: `<p>Mana lebih besar, <b>3/8</b> atau <b>5/8</b>? Kalau <b>penyebutnya sama</b>, kita tinggal membandingkan <b>pembilangnya</b>: 5 &gt; 3, jadi 5/8 &gt; 3/8.</p><p>Kalau <b>penyebutnya berbeda</b>, <b>samakan dulu penyebutnya</b> dengan KPK, baru bandingkan pembilangnya. Contoh 1/2 dan 2/3: KPK = 6, jadi 3/6 dan 4/6. Karena 3 &lt; 4, maka 1/2 &lt; 2/3.</p><p>Cara lain: ubah semuanya ke <b>desimal</b> atau <b>persen</b>. Misalnya 3/4 = 0,75 = 75%. Untuk mengurutkan, bandingkan semuanya lalu susun dari yang <b>terkecil</b> ke <b>terbesar</b> (atau sebaliknya).</p>`,
  vid: () => [
    fr_(STK(ROW(Fh(3, 8), 8, [[0, 3, 'a']]), ROW(Fh(5, 8), 8, [[0, 5, 'b']])), '① Penyebut <b>sama</b> (8): bandingkan <b>pembilang</b>. 5 &gt; 3, jadi 5/8 &gt; 3/8. Batang 5/8 lebih panjang.', 'Penyebutnya sama, yaitu 8. Jadi kita bandingkan pembilangnya. 5 lebih dari 3, jadi 5/8 lebih dari 3/8. Batang 5/8 lebih panjang.'),
    fr_(STK(ROW(Fh(1, 2), 2, [[0, 1, 'a']]), ROW(Fh(2, 3), 3, [[0, 2, 'b']])), '② Bagaimana dengan 1/2 dan 2/3? Penyebutnya <b>berbeda</b>, potongannya tidak sama besar. Kita perlu menyamakannya.', 'Bagaimana dengan 1/2 dan 2/3? Penyebutnya berbeda, jadi potongannya tidak sama besar. Kita perlu menyamakan penyebutnya.'),
    fr_(STK(ROW(Fh(3, 6), 6, [[0, 3, 'a']]), ROW(Fh(4, 6), 6, [[0, 4, 'b']])), '③ KPK dari 2 dan 3 adalah <b>6</b>. 1/2 = 3/6 dan 2/3 = 4/6. Sekarang penyebutnya sama!', 'KPK dari 2 dan 3 adalah 6. 1/2 sama dengan 3/6, dan 2/3 sama dengan 4/6. Sekarang penyebutnya sama.'),
    fr_(`<div class="cmp">${Fh(1, 2)} <b>&lt;</b> ${Fh(2, 3)}</div>`, '④ Karena 3/6 &lt; 4/6, maka <b>1/2 &lt; 2/3</b>.', 'Karena 3/6 kurang dari 4/6, maka 1/2 kurang dari 2/3.'),
    fr_(`<div class="mx">${Fh(3, 4)}<b>=</b><span class="big">0,75</span><b>=</b><span class="big">75%</span></div><div class="mx">${Fh(7, 10)}<b>=</b><span class="big">0,7</span><b>=</b><span class="big">70%</span></div>`, '⑤ Cara lain: ubah ke <b>desimal</b> atau <b>persen</b>. 3/4 = 0,75 = 75% dan 7/10 = 0,7 = 70%. Karena 75% &gt; 70%, maka 3/4 &gt; 7/10.', 'Cara lain, ubah ke desimal atau persen. 3/4 sama dengan 0,75 atau 75 persen, dan 7/10 sama dengan 0,7 atau 70 persen. Karena 75 persen lebih dari 70 persen, maka 3/4 lebih dari 7/10.'),
    fr_(nline(8, [[.25, Fh(1, 4), 'a'], [.5, Fh(1, 2), 'b'], [.625, Fh(5, 8), 'c'], [.75, Fh(3, 4), 'd']]), '⑥ Garis bilangan: makin ke <b>kanan</b> makin <b>besar</b>. Urutan dari terkecil: 1/4, 1/2, 5/8, 3/4.', 'Pada garis bilangan, makin ke kanan nilainya makin besar. Urutan dari yang terkecil: 1/4, 1/2, 5/8, 3/4.'),
    fr_(STK(ROW(Fh(3, 5), 5, [[0, 3, 'a']]), ROW(Fh(5, 8), 8, [[0, 5, 'b']])), '⑦ Giliranmu! Bandingkan 3/5 dan 5/8.', 'Giliranmu. Bandingkan 3/5 dan 5/8.', { q: 'Mana yang lebih besar, 3/5 atau 5/8?', o: ['3/5', '5/8', 'Sama besar'], k: 1, e: 'KPK 5 dan 8 adalah 40. 3/5 = 24/40 dan 5/8 = 25/40. Karena 25 &gt; 24, 5/8 lebih besar.' }),
    fr_(RING('<b>Ingat!</b><br>Penyebut sama → banding <b>pembilang</b>.<br>Penyebut beda → samakan dengan <b>KPK</b>.<br>Atau ubah ke <b>desimal / persen</b>.'), '⑧ Rangkuman: penyebut sama, bandingkan pembilang. Penyebut berbeda, samakan dengan KPK. Atau ubah ke desimal atau persen.', 'Rangkuman. Penyebut sama, bandingkan pembilangnya. Penyebut berbeda, samakan dengan KPK. Atau ubah ke desimal atau persen.')],
  langkah: { judul: 'Langkah membandingkan & mengurutkan pecahan', contoh: `<div class="ex">Contoh: urutkan 0,4 ; 3/8 ; 45% dari yang terkecil.</div>`,
    steps: ['Pilih <b>satu bentuk</b> yang sama, misalnya desimal.', '3/8 = 3 ÷ 8 = <b>0,375</b>; 0,4 tetap <b>0,4</b>; 45% = <b>0,45</b>.', 'Bandingkan: 0,375 &lt; 0,4 &lt; 0,45.', 'Urutan dari terkecil: <b>3/8 ; 0,4 ; 45%</b>.'] },
  contoh: [['🔋', 'Baterai ponsel A tersisa 3/5 dan ponsel B tersisa 2/3. Ponsel B masih lebih penuh (10/15 &gt; 9/15).'], ['🏃', 'Rani berlari 3/4 km dan Sita berlari 0,7 km. Rani berlari lebih jauh (0,75 &gt; 0,7).'], ['🛍️', 'Diskon 1/4 sama dengan 25%, jadi diskon 30% lebih besar daripada diskon 1/4.']],
  cek: [{ q: 'Pernyataan yang benar adalah...', o: ['2/5 > 1/2', '3/4 > 2/3', '1/3 > 1/2'], k: 1, e: '3/4 = 9/12 dan 2/3 = 8/12, jadi 3/4 &gt; 2/3.' }, { q: '0,6 sama dengan ... persen.', o: ['6%', '60%', '0,6%'], k: 1, e: '0,6 = 6/10 = 60/100 = 60%.' }, { q: 'Urutan terkecil ke terbesar dari 1/2, 1/4, 3/4 adalah...', o: ['1/4, 1/2, 3/4', '1/2, 1/4, 3/4', '3/4, 1/2, 1/4'], k: 0, e: '1/4 = 0,25; 1/2 = 0,5; 3/4 = 0,75. Urutan: 1/4, 1/2, 3/4.' }],
  ingat: 'Penyebut sama: bandingkan <b>pembilang</b>. Penyebut berbeda: samakan dengan <b>KPK</b>, atau ubah ke <b>desimal/persen</b>. Mengurutkan: bandingkan semuanya lalu susun dari kecil ke besar.' },
{ id: 3, d: 1, ic: '➕', t: 'Penjumlahan Pecahan', sub: 'penyebut sama, beda, dan campuran', tp: 'TP-3', mnt: 15, wd: 'tambah',
  tujuan: 'Kamu dapat menjumlahkan pecahan berpenyebut sama maupun berbeda, termasuk pecahan campuran.',
  cover: STK(ROW(Fh(1, 2), 6, [[0, 3, 'a']]), ROW(Fh(1, 3), 6, [[0, 2, 'b']])),
  konsepJudul: 'Bagaimana menjumlahkan pecahan?',
  konsep: `<p>Kalau <b>penyebutnya sama</b>, jumlahkan <b>pembilangnya</b> saja, <b>penyebutnya tetap</b>. Contoh 1/4 + 2/4 = 3/4. Artinya 1 potong ditambah 2 potong sama besar menjadi 3 potong.</p><p>Kalau <b>penyebutnya berbeda</b>, potongannya tidak sama besar sehingga belum bisa dijumlahkan. <b>Samakan dulu penyebutnya</b> dengan KPK, baru jumlahkan pembilangnya. Contoh 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</p><p>Untuk <b>pecahan campuran</b>, jumlahkan bagian bulatnya, lalu jumlahkan bagian pecahannya. Jika pecahan hasilnya lebih dari 1, ubah menjadi campuran dan gabungkan dengan bagian bulatnya.</p>`,
  vid: () => [
    fr_(STK(ROW(Fh(1, 4), 4, [[0, 1, 'a']]), ROW('+ ' + Fh(2, 4), 4, [[1, 3, 'b']]), ROW('= ' + Fh(3, 4), 4, [[0, 1, 'a'], [1, 3, 'b']])), '① 1/4 + 2/4. Potongannya <b>sama besar</b>, jadi tinggal digabung: 1 potong + 2 potong = 3 potong, yaitu 3/4.', 'Satu per empat ditambah dua per empat. Potongannya sama besar, jadi tinggal digabung. Satu potong ditambah dua potong sama dengan tiga potong, yaitu tiga per empat.'),
    fr_(`<div class="mx">${Fh(1, 4)}<b>+</b>${Fh(2, 4)}<b>=</b>${Fh('1+2', 4)}<b>=</b>${Fh(3, 4)}</div>`, '② Aturannya: penyebut sama → jumlahkan <b>pembilang</b>, <b>penyebut</b> tetap 4. Penyebut tidak ikut dijumlahkan!', 'Aturannya, penyebut sama, jumlahkan pembilangnya, dan penyebutnya tetap. Penyebut tidak ikut dijumlahkan.'),
    fr_(STK(ROW(Fh(1, 2), 2, [[0, 1, 'a']]), ROW(Fh(1, 3), 3, [[0, 1, 'b']])), '③ Sekarang 1/2 + 1/3. Potongannya <b>tidak sama besar</b> (dibagi 2 dan dibagi 3), jadi belum bisa langsung dijumlahkan.', 'Sekarang 1/2 ditambah 1/3. Potongannya tidak sama besar, satu dibagi dua dan satu dibagi tiga, jadi belum bisa langsung dijumlahkan.'),
    fr_(STK(ROW(Fh(3, 6), 6, [[0, 3, 'a']]), ROW(Fh(2, 6), 6, [[0, 2, 'b']])), '④ Samakan dengan <b>KPK</b> 2 dan 3 = <b>6</b>. 1/2 = 3/6 dan 1/3 = 2/6. Sekarang potongannya sama besar!', 'Samakan dengan KPK dari 2 dan 3, yaitu 6. 1/2 sama dengan 3/6, dan 1/3 sama dengan 2/6. Sekarang potongannya sama besar.'),
    fr_(ROW(Fh(5, 6), 6, [[0, 3, 'a'], [3, 5, 'b']]) + `<div class="mx">${Fh(3, 6)}<b>+</b>${Fh(2, 6)}<b>=</b>${Fh(5, 6)}</div>`, '⑤ Jumlahkan: 3/6 + 2/6 = <b>5/6</b>.', 'Jumlahkan, 3/6 ditambah 2/6 sama dengan 5/6.'),
    fr_(STK(ROW('Jawaban salah ' + Fh(2, 5), 5, [[0, 2, 'd']]), ROW('Padahal ' + Fh(1, 2) + ' saja', 2, [[0, 1, 'a']])), '⑥ <b>Awas kesalahan umum!</b> 1/2 + 1/3 ≠ 2/5. Hasil 2/5 lebih <b>kecil</b> daripada 1/2, mustahil karena ditambah malah mengecil. Penyebut tidak boleh dijumlahkan.', 'Awas kesalahan umum. Satu per dua ditambah satu per tiga bukan dua per lima. Dua per lima lebih kecil daripada satu per dua, mustahil karena ditambah malah mengecil. Penyebut tidak boleh dijumlahkan.'),
    fr_(LN('2 1/4 + 1 2/3', 'Bulat: 2 + 1 = 3', 'Pecahan: 3/12 + 8/12 = 11/12', '<b>Hasil: 3 11/12</b>'), '⑦ <b>Pecahan campuran</b>: 2 1/4 + 1 2/3. Bulat: 2 + 1 = 3. Pecahan: 1/4 + 2/3 = 3/12 + 8/12 = 11/12. Hasil 3 11/12. Jika pecahannya lebih dari 1, ubah menjadi campuran lalu gabungkan.', 'Pecahan campuran, 2 1/4 ditambah 1 2/3. Bulatnya, 2 ditambah 1 sama dengan 3. Pecahannya, 1/4 ditambah 2/3 sama dengan 3/12 ditambah 8/12, yaitu 11/12. Hasilnya 3 11/12. Jika pecahannya lebih dari satu, ubah menjadi campuran lalu gabungkan.'),
    fr_(STK(ROW(Fh(2, 3), 6, [[0, 4, 'a']]), ROW(Fh(1, 6), 6, [[4, 5, 'b']])), '⑧ Giliranmu! 2/3 + 1/6.', 'Giliranmu. 2/3 ditambah 1/6.', { q: 'Berapa hasil 2/3 + 1/6?', o: ['3/9', '5/6', '3/6'], k: 1, e: '2/3 = 4/6, jadi 4/6 + 1/6 = 5/6.' }),
    fr_(RING('<b>Ingat!</b><br>Penyebut <b>sama</b>: jumlahkan pembilang.<br>Penyebut <b>beda</b>: samakan dengan KPK dulu.<br>Penyebut <b>tidak</b> dijumlahkan!'), '⑨ Rangkuman: penyebut sama, jumlahkan pembilang. Penyebut berbeda, samakan dengan KPK dulu. Penyebut tidak pernah dijumlahkan.', 'Rangkuman. Penyebut sama, jumlahkan pembilangnya. Penyebut berbeda, samakan dengan KPK dulu. Penyebut tidak pernah dijumlahkan.')],
  langkah: { judul: 'Langkah menjumlahkan pecahan', contoh: `<div class="ex">Contoh: 3/4 + 5/6.</div>`,
    steps: ['Cari <b>KPK</b> dari penyebut 4 dan 6, yaitu <b>12</b>.', 'Samakan: 3/4 = <b>9/12</b> dan 5/6 = <b>10/12</b>.', 'Jumlahkan pembilang: 9 + 10 = 19, jadi <b>19/12</b>.', 'Ubah ke campuran: 19/12 = <b>1 7/12</b>.'] },
  contoh: [['🧁', 'Ibu memakai 3/4 kg tepung untuk kue lapis dan 1/2 kg untuk bolu. Total tepung 3/4 + 2/4 = 5/4 = 1 1/4 kg.'], ['🏃', 'Pagi berlari 1/2 km dan sore 1/3 km. Seluruhnya 3/6 + 2/6 = 5/6 km.'], ['🍕', 'Dika makan 1/3 pizza dan Ani 1/4 pizza. Yang dimakan 4/12 + 3/12 = 7/12 pizza.']],
  cek: [{ q: '1/5 + 2/5 = ...', o: ['3/10', '3/5', '2/5'], k: 1, e: 'Penyebut sama, jumlahkan pembilang: 1 + 2 = 3, penyebut tetap 5. Jadi 3/5.' }, { q: '1/3 + 1/4 = ...', o: ['2/7', '7/12', '2/12'], k: 1, e: 'KPK 12: 4/12 + 3/12 = 7/12.' }, { q: '1 1/2 + 2 1/3 = ...', o: ['3 5/6', '3 2/5', '4 1/6'], k: 0, e: 'Bulat 1 + 2 = 3. Pecahan 3/6 + 2/6 = 5/6. Hasil 3 5/6.' }],
  ingat: 'Penyebut sama: jumlahkan <b>pembilang</b>, penyebut tetap. Penyebut berbeda: samakan dengan <b>KPK</b> dulu. Campuran: jumlahkan bulat dan pecahan terpisah. Jangan jumlahkan penyebutnya!' },
{ id: 4, d: 1, ic: '➖', t: 'Pengurangan Pecahan', sub: 'termasuk meminjam satu utuh', tp: 'TP-3', mnt: 15, wd: 'kurang',
  tujuan: 'Kamu dapat mengurangkan pecahan berpenyebut sama dan berbeda, termasuk pecahan campuran yang perlu "meminjam".',
  cover: STK(ROW(Fh(5, 6), 6, [[0, 5, 'a']]), ROW('− ' + Fh(2, 6), 6, [[3, 5, 'd']])),
  konsepJudul: 'Bagaimana mengurangkan pecahan?',
  konsep: `<p>Mengurangkan pecahan mirip dengan menjumlahkan. Kalau <b>penyebut sama</b>, kurangkan <b>pembilangnya</b>, penyebut tetap. Contoh 3/4 − 1/4 = 2/4 = 1/2.</p><p>Kalau <b>penyebut berbeda</b>, <b>samakan penyebut</b> dengan KPK dulu. Contoh 5/6 − 1/3 = 5/6 − 2/6 = 3/6 = 1/2.</p><p>Pada <b>pecahan campuran</b>, kadang pecahan pertama lebih kecil dari pecahan kedua (misalnya 1/5 dan 3/4). Kita bisa <b>meminjam 1 utuh</b>, atau lebih mudah <b>mengubah keduanya menjadi pecahan tidak wajar</b>. Setelah itu, <b>sederhanakan</b> hasilnya.</p>`,
  vid: () => [
    fr_(STK(ROW(Fh(3, 4), 4, [[0, 3, 'a']]), ROW('− ' + Fh(1, 4), 4, [[2, 3, 'd']]), ROW('= ' + Fh(2, 4), 4, [[0, 2, 'a']])), '① 3/4 − 1/4. Dari 3 potong, kita ambil 1 potong (merah muda). Sisa <b>2 potong</b>, yaitu 2/4.', 'Tiga per empat dikurangi satu per empat. Dari tiga potong, kita ambil satu potong. Sisa dua potong, yaitu dua per empat.'),
    fr_(MULX(2, 4, 2, '÷'), '② 2/4 masih bisa disederhanakan: bagi atas dan bawah dengan 2, jadi <b>1/2</b>. Selalu periksa apakah hasil bisa disederhanakan!', 'Dua per empat masih bisa disederhanakan. Bagi atas dan bawah dengan 2, jadi satu per dua. Selalu periksa apakah hasil bisa disederhanakan.'),
    fr_(STK(ROW(Fh(5, 6), 6, [[0, 5, 'a']]), ROW('− ' + Fh(2, 6), 6, [[3, 5, 'd']]), ROW('= ' + Fh(3, 6), 6, [[0, 3, 'a']])), '③ 5/6 − 1/3. Penyebut berbeda, jadi 1/3 diubah menjadi <b>2/6</b>. Lalu 5/6 − 2/6 = 3/6 = <b>1/2</b>.', 'Lima per enam dikurangi satu per tiga. Penyebut berbeda, jadi satu per tiga diubah menjadi dua per enam. Lalu lima per enam dikurangi dua per enam sama dengan tiga per enam, yaitu satu per dua.'),
    fr_(LN('4 3/4 − 1 1/2', 'Bulat: 4 − 1 = 3', 'Pecahan: 3/4 − 2/4 = 1/4', '<b>Hasil: 3 1/4</b>'), '④ <b>Campuran</b>: 4 3/4 − 1 1/2. Bulat: 4 − 1 = 3. Pecahan: 3/4 − 2/4 = 1/4. Hasilnya 3 1/4.', 'Pecahan campuran, 4 3/4 dikurangi 1 1/2. Bulatnya, 4 dikurangi 1 sama dengan 3. Pecahannya, 3/4 dikurangi 2/4 sama dengan 1/4. Hasilnya 3 1/4.'),
    fr_(LN('3 1/5 − 1 3/4', '1/5 lebih kecil dari 3/4, sulit dikurangkan langsung!', 'Ubah: 3 1/5 = 16/5 dan 1 3/4 = 7/4', 'KPK 20: 64/20 − 35/20 = 29/20', '<b>= 1 9/20</b>'), '⑤ <b>Meminjam</b>: 3 1/5 − 1 3/4. Karena 1/5 &lt; 3/4, ubah keduanya menjadi pecahan tidak wajar: 16/5 dan 7/4. KPK 20: 64/20 − 35/20 = 29/20 = 1 9/20.', 'Meminjam. 3 1/5 dikurangi 1 3/4. Karena 1/5 lebih kecil dari 3/4, ubah keduanya menjadi pecahan tidak wajar, yaitu 16/5 dan 7/4. Dengan KPK 20, 64/20 dikurangi 35/20 sama dengan 29/20, yaitu 1 9/20.'),
    fr_(LN('Cek dengan menjumlah balik:', '1 9/20 + 1 3/4', '= 29/20 + 35/20 = 64/20', '= 3 1/5 ✓'), '⑥ <b>Cek hasil</b> dengan menjumlah balik: 1 9/20 + 1 3/4 = 29/20 + 35/20 = 64/20 = 3 1/5. Cocok dengan soal awal!', 'Cek hasilnya dengan menjumlah balik. 1 9/20 ditambah 1 3/4 sama dengan 29/20 ditambah 35/20, yaitu 64/20 atau 3 1/5. Cocok dengan soal awal.'),
    fr_(STK(ROW(Fh(5, 6), 6, [[0, 5, 'a']]), ROW('− ' + Fh(1, 2), 6, [[2, 5, 'd']])), '⑦ Giliranmu! 5/6 − 1/2.', 'Giliranmu. 5/6 dikurangi 1/2.', { q: 'Berapa hasil 5/6 − 1/2?', o: ['4/4', '1/3', '2/3'], k: 1, e: '1/2 = 3/6. Jadi 5/6 − 3/6 = 2/6 = 1/3.' }),
    fr_(RING('<b>Ingat!</b><br>Samakan <b>penyebut</b> dulu.<br>Kurangkan <b>pembilang</b>.<br><b>Sederhanakan</b> hasilnya.'), '⑧ Rangkuman: samakan penyebut, kurangkan pembilang, lalu sederhanakan. Untuk campuran yang sulit, ubah menjadi pecahan tidak wajar.', 'Rangkuman. Samakan penyebut, kurangkan pembilang, lalu sederhanakan. Untuk campuran yang sulit, ubah menjadi pecahan tidak wajar.')],
  langkah: { judul: 'Langkah mengurangkan pecahan', contoh: `<div class="ex">Contoh: 5 − 1 3/4 − 2 1/2 (sisa tali dari 5 meter).</div>`,
    steps: ['Hitung dulu yang <b>terpakai</b>: 1 3/4 + 2 1/2 = 7/4 + 10/4 = 17/4 = <b>4 1/4</b>.', 'Kurangkan dari 5: 5 − 4 1/4.', 'Ubah 5 = 20/4, sehingga 20/4 − 17/4 = <b>3/4</b>.', 'Jadi sisa tali <b>3/4 meter</b>.'] },
  contoh: [['🎀', 'Pita 3 m dipakai 1 1/2 m. Sisa pita 3 − 1 1/2 = 1 1/2 m.'], ['🍕', 'Sisa pizza setelah dimakan 1/3 dan 1/4: 1 − 7/12 = 5/12 bagian.'], ['🛢️', 'Tangki solar berisi 3/4 bagian, terpakai 1/3 bagian. Sisa 9/12 − 4/12 = 5/12 bagian.']],
  cek: [{ q: '7/8 − 3/8 = ... (paling sederhana)', o: ['4/16', '1/2', '10/8'], k: 1, e: '7 − 3 = 4, jadi 4/8 yang disederhanakan menjadi 1/2.' }, { q: '3/4 − 1/3 = ...', o: ['2/12', '5/12', '2/7'], k: 1, e: 'KPK 12: 9/12 − 4/12 = 5/12.' }, { q: '2 1/2 − 1 3/4 = ...', o: ['1 1/4', '3/4', '1 1/2'], k: 1, e: '2 1/2 = 5/2 = 10/4 dan 1 3/4 = 7/4. Jadi 10/4 − 7/4 = 3/4.' }],
  ingat: 'Kurangkan pecahan: <b>samakan penyebut</b>, kurangkan <b>pembilang</b>, <b>sederhanakan</b>. Campuran sulit: ubah ke pecahan tidak wajar. Cek hasil dengan menjumlah balik.' },
{ id: 5, d: 2, ic: '✖️', t: 'Perkalian & Pembagian Pecahan', sub: 'model luas dan kebalikan', tp: 'TP-4', mnt: 16, wd: 'kali',
  tujuan: 'Kamu dapat mengalikan dan membagi pecahan serta menerapkannya pada masalah sehari-hari.',
  cover: area(2, 4, 1, 3),
  konsepJudul: 'Bagaimana mengalikan dan membagi pecahan?',
  konsep: `<p><b>Perkalian:</b> kalikan <b>pembilang dengan pembilang</b> dan <b>penyebut dengan penyebut</b>. Tidak perlu menyamakan penyebut! Contoh 1/2 × 3/4 = 3/8. Artinya "setengah dari 3/4".</p><p>Bilangan bulat dikali pecahan: kalikan bilangan bulat dengan <b>pembilangnya</b>. Contoh 3 × 2/5 = 6/5 = 1 1/5.</p><p><b>Pembagian:</b> bagi pecahan artinya <b>kalikan dengan kebalikannya</b>. Contoh 3/4 ÷ 1/4 = 3/4 × 4/1 = 3. Maknanya: "ada berapa potong 1/4 di dalam 3/4?"</p>`,
  vid: () => [

const sl = (id, arr, v, f) => `<select id="${id}" aria-label="pilih">${arr.map((x, i) => `<option value="${i}" ${i === v ? 'selected' : ''}>${f ? f(x) : x}</option>`).join('')}</select>`;

    <div class="wd"><h4>② Menyederhanakan</h4><p>Pilih pecahan: ${sl('w2', SM, si, ft)}</p>${ROW(Fh(p, q), q, [[0, p, 'a']])}${g > 1 ? `<div class="mx">${Fh(p, q)}<span class="ar">÷${g}<br>÷${g}</span><b>=</b>${Fh(p / g, q / g)}</div><p class="bx">FPB dari ${p} dan ${q} adalah <b>${g}</b>. Bentuk paling sederhana: <b>${p / g}/${q / g}</b>.</p>` : `<p class="bx">FPB dari ${p} dan ${q} adalah 1, jadi sudah <b>paling sederhana</b>.</p>`}</div>`;
    $id('w1').onchange = e => { bi = +e.target.value; mainkan('klik'); dr(); }; $id('w1k').oninput = e => { k = +e.target.value; dr(); $id('w1k').focus(); }; $id('w2').onchange = e => { si = +e.target.value; mainkan('klik'); dr(); }; };
  dr();

WD.banding = el => {
  let i = 2, j = 8, ord = [], sel = [], tgt = []; const ac = () => { const s = new Set(); while (s.size < 4) s.add(Math.floor(Math.random() * FL.length)); ord = [...s]; tgt = ord.slice().sort((x, y) => FL[x][0] / FL[x][1] - FL[y][0] / FL[y][1]); sel = []; };
  ac();
  const dr = () => { const [a, b] = FL[i], [c, d] = FL[j], L = lcm(b, d), A = a * L / b, C = c * L / d, s = A === C ? '=' : A < C ? '&lt;' : '&gt;';
    const sdone = sel.length === 4, benar = sdone && sel.every((x, n) => FL[x][0] / FL[x][1] === FL[tgt[n]][0] / FL[tgt[n]][1]);
    el.innerHTML = `<div class="wd"><h4>① Bandingkan dua pecahan</h4><p>${sl('wa', FL, i, ft)} dengan ${sl('wb', FL, j, ft)}</p>${STK(ROW(Fh(a, b), b, [[0, a, 'a']]), ROW(Fh(c, d), d, [[0, c, 'b']]))}
    ${b === d ? '<p class="bx">Penyebut sama, bandingkan pembilang saja.</p>' : `<p class="bx">KPK dari ${b} dan ${d} = <b>${L}</b>. ${Fh(a, b)} = ${Fh(A, L)} dan ${Fh(c, d)} = ${Fh(C, L)}.</p>`}<div class="cmp">${Fh(a, b)} <b>${s}</b> ${Fh(c, d)}</div></div>
    <div class="wd"><h4>② Urutkan dari TERKECIL ke TERBESAR</h4><p>Ketuk pecahan satu per satu secara berurutan.</p><div class="tiles">${ord.map(x => `<button class="tile ${sel.includes(x) ? 'on' : ''}" data-x="${x}" ${sel.includes(x) ? 'disabled' : ''}>${Fh(FL[x][0], FL[x][1])}</button>`).join('')}</div><p>Urutanmu: ${sel.map(x => Fh(FL[x][0], FL[x][1])).join(' &lt; ') || '<i>belum ada</i>'}</p>${sdone ? `<div class="bx">${benar ? '🎉 <b>Benar!</b> Urutannya sudah tepat.' : '💭 Belum tepat. Urutan benar: ' + tgt.map(x => Fh(FL[x][0], FL[x][1])).join(' &lt; ')}</div>` : ''}<p><button class="btn sec" id="wr">↺ Ulangi</button> <button class="btn" id="wn">Soal baru</button></p></div>`;
    $id('wa').onchange = e => { i = +e.target.value; mainkan('klik'); dr(); }; $id('wb').onchange = e => { j = +e.target.value; mainkan('klik'); dr(); };

function sumBars(L, n, col) { const x = Math.min(n, L); return ROW('', L, [[0, x, col]]) + (n > L ? ROW('lebih', L, [[0, n - L, col]]) : ''); }

    ${STK(ROW(Fh(A, L), L, [[0, A, 'a']]), ROW('+ ' + Fh(C, L), L, [[A, A + C > L ? L : A + C, 'b']]))}<p>Hasil (satu utuh = ${L} bagian):</p>${sumBars(L, S, 'g')}<div class="cmp">${Fh(a, b)} + ${Fh(c, d)} = <b>${mix(S, L)}</b></div></div>`;
    $id('wa').onchange = e => { i = +e.target.value; mainkan('klik'); dr(); }; $id('wb').onchange = e => { j = +e.target.value; mainkan('klik'); dr(); }; };
  dr();
};
WD.kurang = el => {

function formSoal(q) {
  q = q || { id: '', asesmen: 3, jenis: 'PG', teks: '', pilihan: [], kunci: '', penjelasan: '', tp: '', topik: '', stimulus: '', status: 'aktif' };
  kunciModal(0); modal(`<h2>${q.id ? 'Ubah' : 'Tambah'} soal</h2><div class="grid"><div><label for="fi">ID soal</label><input id="fi" value="${esc(q.id)}" ${q.id ? 'readonly' : ''}></div><div><label for="fas">Asesmen</label><select id="fas">${[1, 2, 3].map(n => `<option ${n == q.asesmen ? 'selected' : ''}>${n}</option>`).join('')}</select></div><div><label for="fj">Jenis</label><select id="fj">${[['PG', 'Pilihan ganda'], ['PGK', 'PG kompleks'], ['KAT', 'Benar/Salah'], ['URUT', 'Mengurutkan'], ['ISI', 'Isian']].map(j => `<option value="${j[0]}" ${j[0] === q.jenis ? 'selected' : ''}>${j[1]}</option>`).join('')}</select></div></div>
  <label for="ft">Teks soal</label><textarea id="ft" rows="3">${esc(q.teks)}</textarea><label for="fp">Pilihan / pernyataan (satu per baris)</label><textarea id="fp" rows="4">${esc((q.pilihan || []).join('\n'))}</textarea>
  <label for="fk">Kunci <small id="fh"></small></label><input id="fk" value="${esc(q.kunci)}"><label for="fe">Penjelasan</label><textarea id="fe" rows="2">${esc(q.penjelasan)}</textarea>
  <div class="grid"><div><label for="ftp">TP</label><input id="ftp" value="${esc(q.tp)}" placeholder="TP-4"></div><div><label for="fto">Topik materi</label><input id="fto" value="${esc(q.topik)}"></div><div><label for="fs">Stimulus</label><select id="fs"><option value="">— tanpa —</option>${stimCache.map(s => `<option value="${esc(s.id)}" ${s.id === q.stimulus ? 'selected' : ''}>${esc(s.id)} — ${esc(s.judul)}</option>`).join('')}</select></div><div><label for="fst">Status</label><select id="fst"><option ${q.status !== 'nonaktif' ? 'selected' : ''}>aktif</option><option ${q.status === 'nonaktif' ? 'selected' : ''}>nonaktif</option></select></div></div>
  <p style="display:flex;gap:8px"><button class="btn sec" id="x">Batal</button><button class="btn" id="sv">Simpan</button></p>`);
  const h = () => fh.textContent = { PG: '(satu huruf, mis. B)', PGK: '(beberapa huruf, mis. A,C)', KAT: '(B/S per pernyataan, mis. B,S,B)', URUT: '(urutan benar memakai huruf, mis. C,A,B,D)', ISI: '(jawaban; alternatif dipisah |, mis. 2/4|1/2)' }[fj.value]; h(); fj.onchange = h;
  sv.onclick = async () => { sv.disabled = true; const r = await api('guru.bank.simpan', { soal: [{ id: fi.value.trim(), asesmen: fas.value, jenis: fj.value, teks: ft.value.trim(), pilihan: fp.value.split('\n').map(x => x.trim()).filter(Boolean), kunci: fk.value.trim(), penjelasan: fe.value.trim(), tp: ftp.value.trim(), topik: fto.value.trim(), stimulus: fs.value, status: fst.value }] }); sv.disabled = false; toast(r.message); if (r.success) { tutupModal(); GP.bank(); } };
}
function formStimulus() {
  kunciModal(0); modal(`<h2>Stimulus bacaan / tabel</h2><label for="si">ID (mis. ST-02)</label><input id="si"><label for="sj">Jenis</label><select id="sj"><option value="teks">Teks bacaan</option><option value="tabel">Tabel (kolom dipisah |)</option></select><label for="sl">Judul</label><input id="sl"><label for="sx">Isi</label><textarea id="sx" rows="6"></textarea><p style="display:flex;gap:8px"><button class="btn sec" id="x">Batal</button><button class="btn" id="sv">Simpan</button></p>`);
  sv.onclick = async () => { const r = await api('guru.stimulus.simpan', { id: si.value, jenis: sj.value, judul: sl.value, isi: sx.value }); toast(r.message); if (r.success) { tutupModal(); GP.bank(); } };
}
function formImpor() {
  kunciModal(0); modal(`<h2>Impor soal dari CSV</h2><p>Kolom: <code>${CSVH.join(', ')}</code>. Pisahkan pilihan dengan <code>||</code>.</p><p><button class="btn sec" id="tp">⬇ Unduh templat</button></p><input type="file" id="fl" accept=".csv,text/csv"><label for="ct">atau tempel isi CSV</label><textarea id="ct" rows="6"></textarea><div id="lp" class="pre" hidden></div><p style="display:flex;gap:8px"><button class="btn sec" id="x">Batal</button><button class="btn" id="go">Impor</button></p>`);
  tp.onclick = () => { const b = new Blob(['\ufeff' + CSVH.join(',') + '\nA3-90,3,PG,"Contoh soal?",3/5||3/8||5/8||8/3,B,Penjelasan,TP-1,Representasi,,aktif\n'], { type: 'text/csv' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'templat-bank-soal.csv'; a.click(); };
  fl.onchange = () => { const f = fl.files[0]; if (f) { const rd = new FileReader(); rd.onload = () => ct.value = rd.result; rd.readAsText(f); } };
  go.onclick = async () => { const rw = parseCSV(ct.value.replace(/^\ufeff/, '')); if (rw.length < 2) return toast('CSV kosong.'); const h = rw[0].map(x => x.trim().toLowerCase()); const soal = rw.slice(1).map(r => { const o = {}; h.forEach((k, i) => o[k] = (r[i] || '').trim()); o.pilihan = (o.pilihan || '').split('||').map(x => x.trim()).filter(Boolean); return o; }); go.disabled = true; const r = await api('guru.bank.simpan', { soal }); go.disabled = false; toast(r.message || 'Selesai'); lp.hidden = false; lp.textContent = r.success ? `Baru: ${r.data.baru}, diubah: ${r.data.diubah}\n${(r.data.galat || []).join('\n')}` : r.message; if (r.success && !(r.data.galat || []).length) { tutupModal(); GP.bank(); } };
}

// ---- hasil & jurnal ----
GP.hasil = async () => {
  const r = await api('guru.hasil'); if (!r.success) return gm(gErr(r)); window._hasil = r.data;
  const kl = [...new Set(r.data.resmi.map(x => x.kelas))].filter(Boolean), f = window._hk || '';
  gm(`<h2>Hasil & Nilai Siswa</h2><p style="display:flex;gap:8px;flex-wrap:wrap"><select id="hk"><option value="">Semua kelas</option>${kl.map(k => `<option ${k === f ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select><button class="btn" id="xl">⬇ Ekspor Excel</button><button class="btn sec" id="pd">🖨️ Cetak laporan</button></p>
  <div class="card scroll" id="tbl"><table class="tbl"><tr><th>Siswa</th><th>Kelas</th><th>Asesmen</th><th>Nilai</th><th>Status</th><th>Refleksi</th><th>Tanggal</th></tr>${r.data.resmi.filter(x => !f || x.kelas === f).map(x => `<tr><td>${esc(x.siswa)}</td><td>${esc(x.kelas)}</td><td>${esc(x.asesmen)}</td><td><b>${esc(x.skor)}</b></td><td><span class="chp ${x.status === 'YA' ? 'a' : 'd'}">${x.status === 'YA' ? 'Resmi' : esc(x.status)}</span></td><td>${x.refleksi ? '✅' : '—'}</td><td>${esc(String(x.tanggal).slice(0, 10))}</td></tr>`).join('') || '<tr><td colspan="7">Belum ada hasil.</td></tr>'}</table></div>`);
  hk.onchange = () => { window._hk = hk.value; GP.hasil(); }; pd.onclick = () => { let c = document.getElementById('cetak'); if (!c) { c = document.createElement('div'); c.id = 'cetak'; document.body.appendChild(c); } c.innerHTML = '<h2>Rekap Hasil Petualangan Pecahan</h2>' + document.getElementById('tbl').innerHTML; print(); };
  xl.onclick = async () => {
    const rows = [['Siswa', 'Kelas', 'Asesmen', 'Nilai', 'Status', 'Refleksi', 'Tanggal']].concat(r.data.resmi.filter(x => !f || x.kelas === f).map(x => [x.siswa, x.kelas, x.asesmen, x.skor, x.status, x.refleksi ? 'Ya' : 'Belum', String(x.tanggal).slice(0, 10)]));
    try { if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Nilai Resmi'); XLSX.writeFile(wb, 'rekap-petualangan-pecahan.xlsx'); }
    catch (e) { const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n'), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'rekap-petualangan-pecahan.csv'; a.click(); toast('Excel tidak tersedia, diunduh sebagai CSV.'); }
  };
};
GP.jurnal = async () => { const r = await api('guru.jurnal'); if (!r.success) return gm(gErr(r)); gm(`<h2>Jurnal Refleksi Siswa</h2>${r.data.map(x => `<div class="card" style="margin:10px 0"><b>${esc(x.siswa)}</b> • Asesmen ${esc(x.asesmen)} ${esc(x.perasaan)} <small>${esc(String(x.waktu).slice(0, 10))}</small><p>${esc(x.isi)}</p><p><i>Rencana: ${esc(x.rencana)}</i></p></div>`).join('') || '<p>Belum ada refleksi.</p>'}`); };

// ---- kelas, kelompok, buka kunci ----
GP.kelas = async () => {
  const r = await api('guru.siswa.list'); if (!r.success) return gm(gErr(r));
  gm(`<h2>Kelola Kelas & Kelompok</h2><div class="card"><h3>Tambah siswa</h3><p><small>Satu siswa per baris: <code>Nama Lengkap, Kelas</code> (mis. Budi Pratama, VII-A). Nama dipakai untuk login.</small></p><textarea id="ns" rows="4"></textarea><p><button class="btn" id="as">Tambahkan</button></p></div>
  <div class="card" style="margin-top:12px"><h3>Kelompok belajar</h3><p>Bentuk otomatis per kelas, ukuran <select id="uk">${[3, 4, 5, 6].map(n => `<option ${n === 4 ? 'selected' : ''}>${n}</option>`).join('')}</select> <button class="btn sec" id="bk">Bentuk kelompok</button></p></div>
  <div class="card" style="margin-top:12px"><h3>Buka kunci tahap manual</h3><p><select id="ks" aria-label="Siswa">${r.data.map(s => `<option>${esc(s.nama)}</option>`).join('')}</select> <select id="kt2" aria-label="Tahap">${['A1', 'R1', 'A2', 'R2', 'A3', 'R3'].map(t => `<option>${t}</option>`).join('')}</select> <button class="btn sec" id="bu">Buka tahap</button></p></div>
  <div class="card scroll" style="margin-top:12px"><table class="tbl"><tr><th>Nama</th><th>Kelas</th><th>Kelompok</th></tr>${r.data.map(s => `<tr><td>${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>${esc(s.kelompok)}</td></tr>`).join('')}</table></div>`);
  as.onclick = async () => { const siswa = ns.value.split('\n').map(l => l.split(',')).filter(a => a[0].trim()).map(a => ({ nama: a[0].trim(), kelas: (a[1] || '').trim() })); const x = await api('guru.siswa.simpan', { siswa }); toast(x.success ? x.data.ditambah + ' siswa ditambahkan.' : x.message); GP.kelas(); };
  bk.onclick = async () => { const x = await api('guru.kelompok.bentuk', { ukuran: +uk.value }); toast(x.message); GP.kelas(); };
  bu.onclick = async () => { const x = await api('guru.bukaKunci', { siswa: ks.value, tahap: kt2.value }); toast(x.message); };
};

// ---- pengaturan & migrasi ----
GP.atur = async () => {
  const p = await api('guru.pengaturan'); if (!p.success) return gm(gErr(p));
  gm(`<h2>Pengaturan</h2><div class="card"><h3>Asesmen 3</h3><label for="aj">Jumlah soal (5–40)</label><input id="aj" type="number" value="${esc(p.data.A3_JUMLAH)}"><label for="am">Durasi menit (10–120)</label><input id="am" type="number" value="${esc(p.data.A3_MENIT)}"><p><button class="btn" id="sa">Simpan</button></p></div>
  <div class="card" style="margin-top:12px"><h3>Migrasi data aplikasi lama</h3><p><small>Tempel URL/ID spreadsheet aplikasi lama. Hanya dibaca. Selalu mulai dengan uji coba.</small></p><input id="ms" placeholder="https://docs.google.com/spreadsheets/d/…"><p><button class="btn sec" id="dr">Uji coba (tidak menulis)</button> <button class="btn" id="mj">Jalankan migrasi</button></p><div id="mr" class="pre" hidden></div></div>`);
  sa.onclick = async () => { const x = await api('guru.pengaturan', { simpan: 1, A3_JUMLAH: aj.value, A3_MENIT: am.value }); toast(x.success ? 'Tersimpan.' : x.message); GP.atur(); };
  const mig = async dry => { if (!ms.value.trim()) return toast('Isi URL/ID spreadsheet lama.'); if (!dry && !confirm('Jalankan migrasi sungguhan? Pastikan uji coba sudah sesuai.')) return; mr.hidden = false; mr.textContent = 'Memproses…'; const x = await api('guru.migrasi', { sumber: ms.value.trim(), dryRun: dry }); mr.textContent = x.success ? (dry ? 'UJI COBA (tidak ada yang ditulis)\n' : 'SELESAI\n') + JSON.stringify(x.data, null, 1) : x.message; };
  dr.onclick = () => mig(true); mj.onclick = () => mig(false);
};
landing();

</script>
</body>
</html>
